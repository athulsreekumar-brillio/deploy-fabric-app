name: Deploy Fabric demo

on:
  push:
    branches:
      - main
    paths:
      - "ApplicationDemo/**"
      - ".github/workflows/deploy-fabric.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-deploy-${{ vars.FABRIC_WORKSPACE_ID || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    name: Publish to Fabric workspace
    runs-on: ubuntu-latest
    env:
      FABRIC_WORKSPACE_ID: ${{ vars.FABRIC_WORKSPACE_ID }}
      FABRIC_ENVIRONMENT: DEV
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ApplicationDemo/deployment/requirements.txt

      - name: Validate demo package
        run: python ApplicationDemo/deployment/deploy_fabric.py --validate-only

      - name: Install deployment dependencies
        run: python -m pip install -r ApplicationDemo/deployment/requirements.txt

      - name: Check deployment settings
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "$FABRIC_WORKSPACE_ID" || { echo "Set repository variable FABRIC_WORKSPACE_ID"; exit 1; }
          test -n "$AZURE_CLIENT_ID" || { echo "Set repository secret AZURE_CLIENT_ID"; exit 1; }
          test -n "$AZURE_CLIENT_SECRET" || { echo "Set repository secret AZURE_CLIENT_SECRET"; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo "Set repository secret AZURE_TENANT_ID"; exit 1; }
          test -n "$AZURE_SUBSCRIPTION_ID" || { echo "Set repository secret AZURE_SUBSCRIPTION_ID"; exit 1; }

      - name: Sign in to Azure with service principal
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish Fabric items
        run: python ApplicationDemo/deployment/deploy_fabric.py
